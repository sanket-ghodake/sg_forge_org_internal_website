name: SG Forge Unified CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      run_codeql:
        description: 'Run CodeQL Deep Security SAST Analysis'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  pipeline:
    name: "SG Forge Unified Quality & Verification Pipeline"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Ensure Executable Permissions
        run: |
          chmod -R +x portables/bin scripts .agents/hooks .agents/scripts || true
          if [ -d "portables/bun/bin" ]; then
            chmod +x portables/bun/bin/* || true
          fi

      - name: Cache Bun Dependency Store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Setup Environment
        run: cp .env.example .env

      - name: Gitleaks Secret Audit
        run: bun ./portables/bin/gitleaks

      - name: TypeScript Static Compilation (tsc)
        run: bunx tsc --noEmit

      - name: Deterministic 27-Gate Quality Verification
        run: bun scripts/verify-gate.ts

      - name: Execute Full 5-Tier Test Suite
        run: bun test

      - name: CycloneDX SBOM Verification & Generation
        run: bash scripts/generate-sbom.sh

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: docs/security/sbom/cyclonedx-sbom.json
          retention-days: 14

      - name: Initialize CodeQL (Optional)
        if: ${{ github.event.inputs.run_codeql == true || github.event.inputs.run_codeql == 'true' }}
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis (Optional)
        if: ${{ github.event.inputs.run_codeql == true || github.event.inputs.run_codeql == 'true' }}
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"

      - name: Pipeline Status & Audit Receipt
        if: always()
        run: |
          echo "================================================================="
          echo "SG FORGE UNIFIED CI/CD PIPELINE - COMPLETED"
          echo "================================================================="
          echo "Triggered by: ${{ github.actor }}"
          echo "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Status: ${{ job.status }}"
          echo "All required quality and security gates satisfied."
          echo "================================================================="
