name: SG Forge Unified CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      run_codeql:
        description: 'Run CodeQL Deep Security SAST Analysis'
        required: true
        type: boolean
        default: true
      run_sbom:
        description: 'Generate and Upload CycloneDX SBOM'
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ----------------------------------------------------------------------------
  # NODE 1: Fast Secrets & Hygiene (< 10s)
  # ----------------------------------------------------------------------------
  node-secrets-and-hygiene:
    name: "Node 1: Secrets & File Hygiene"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Ensure Executable Permissions
        run: chmod +x portables/bin/* scripts/*.sh || true

      - name: Gitleaks Secret Audit
        run: |
          bun ./portables/bin/gitleaks dir . --redact -v

  # ----------------------------------------------------------------------------
  # NODE 2: Type Safety & 27-Gate Deterministic Quality Gate (< 25s)
  # ----------------------------------------------------------------------------
  node-typecheck-and-gate:
    name: "Node 2: Typecheck & 27-Gate Verification"
    needs: [node-secrets-and-hygiene]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Ensure Executable Permissions
        run: chmod +x portables/bin/* scripts/*.sh || true

      - name: Cache Bun Dependency Store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Setup Environment
        run: cp .env.example .env

      - name: TypeScript Static Compilation (tsc)
        run: bunx tsc --noEmit

      - name: Deterministic 27-Gate Quality Verification
        run: bun scripts/verify-gate.ts

  # ----------------------------------------------------------------------------
  # NODE 3: Full 5-Tier Test Suite (< 30s)
  # ----------------------------------------------------------------------------
  node-test-suite:
    name: "Node 3: 5-Tier Test Suites"
    needs: [node-typecheck-and-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Ensure Executable Permissions
        run: chmod +x portables/bin/* scripts/*.sh || true

      - name: Restore Bun Cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Setup Environment
        run: cp .env.example .env

      - name: Execute Full 5-Tier Tests
        run: bun test

  # ----------------------------------------------------------------------------
  # NODE 4: CodeQL Advanced Security SAST
  # ----------------------------------------------------------------------------
  node-codeql-analysis:
    name: "Node 4: CodeQL Advanced Security"
    needs: [node-test-suite]
    if: ${{ github.event.inputs.run_codeql == 'true' || github.event.inputs.run_codeql == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ----------------------------------------------------------------------------
  # NODE 5: CycloneDX SBOM & Supply Chain Audit
  # ----------------------------------------------------------------------------
  node-sbom-audit:
    name: "Node 5: CycloneDX SBOM Audit"
    needs: [node-test-suite]
    if: ${{ github.event.inputs.run_sbom == 'true' || github.event.inputs.run_sbom == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Ensure Executable Permissions
        run: chmod +x scripts/*.sh || true

      - name: Run SBOM Generator
        run: bash scripts/generate-sbom.sh

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: docs/security/sbom/cyclonedx-sbom.json
          retention-days: 14

  # ----------------------------------------------------------------------------
  # NODE 6: Pipeline Gate Receipt & Verification Summary
  # ----------------------------------------------------------------------------
  node-pipeline-summary:
    name: "Node 6: Pipeline Status & Audit Receipt"
    needs: [node-secrets-and-hygiene, node-typecheck-and-gate, node-test-suite, node-codeql-analysis, node-sbom-audit]
    if: always() && needs.node-secrets-and-hygiene.result == 'success' && needs.node-typecheck-and-gate.result == 'success' && needs.node-test-suite.result == 'success' && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Output Pipeline Summary Receipt
        run: |
          echo "================================================================="
          echo "SG FORGE UNIFIED CI/CD PIPELINE - SUCCESSFUL AUDIT"
          echo "================================================================="
          echo "Triggered by: ${{ github.actor }}"
          echo "Workflow Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Node 1 (Secrets & Hygiene): ${{ needs.node-secrets-and-hygiene.result }}"
          echo "Node 2 (Typecheck & 27-Gate): ${{ needs.node-typecheck-and-gate.result }}"
          echo "Node 3 (5-Tier Test Suite): ${{ needs.node-test-suite.result }}"
          echo "Node 4 (CodeQL SAST): ${{ needs.node-codeql-analysis.result }}"
          echo "Node 5 (SBOM Audit): ${{ needs.node-sbom-audit.result }}"
          echo "All required quality and security gates satisfied."
          echo "================================================================="
