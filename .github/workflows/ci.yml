name: SG Forge CI Pipeline

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Single Fast, Resource-Conserving CI Verification Pipeline (< 30s runtime)
  # ----------------------------------------------------------------------------
  ci-verification:
    name: Type Safety, Quality Gate & 5-Tier Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Dependencies
        run: bun install

      - name: Setup Environment File
        run: cp .env.example .env

      - name: TypeScript Type Safety Check (tsc)
        run: bunx tsc --noEmit

      - name: Deterministic 2-Tier Quality Gate
        run: bun scripts/verify-gate.ts

      - name: Full 5-Tier Test Suite Execution
        run: bun test
