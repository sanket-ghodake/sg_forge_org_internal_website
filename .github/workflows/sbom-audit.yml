name: "SBOM & Supply Chain Audit"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  sbom-audit:
    name: Generate & Verify SBOM
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Run SBOM Generator
      run: bash scripts/generate-sbom.sh

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cyclonedx-sbom
        path: docs/security/sbom/cyclonedx-sbom.json
