      - ../../apps/src/types:/app/apps/src/types:ro
      - ../../apps/src/ui:/app/apps/src/ui:ro
      - ../../apps/src/dev-hub:/app/apps/src/dev-hub:rw
      - forge_bun_cache:/root/.bun/install/cache
