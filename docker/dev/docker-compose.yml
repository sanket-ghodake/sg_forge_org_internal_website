    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
      - forge_db_data:/app/data
    command: ["bun", "--watch", "forge-apps/telemetry/src/server.ts"]
    networks:
      - forge-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'
