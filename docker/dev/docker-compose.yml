# ==============================================================================
# SG Forge 2.0 - Development Environment Compose
# ==============================================================================
services:
  proxy:
    image: caddy:2-alpine
    container_name: forge-proxy-dev
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
