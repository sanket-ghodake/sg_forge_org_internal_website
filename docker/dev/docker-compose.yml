# ==============================================================================
# SG Forge 2.0 - Optimized Development Docker Environment (Hot-Reload Enabled)
# ==============================================================================
name: sg-forge-dev

networks:
  forge-net:
    driver: bridge

volumes:
  forge_bun_cache:
  forge_caddy_data:
  forge_caddy_config:
  forge_dev_db_auth:
  forge_dev_db_portal:
  forge_dev_db_dev_dashboard:
  forge_dev_db_expenses:
  forge_dev_db_billing:
  forge_dev_db_telemetry:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 🔀 Unified Reverse Proxy Gateway (Port 80 / 443)
  proxy:
    image: caddy:2-alpine
    container_name: forge-proxy-dev
    profiles: ["core", "apps", "monitoring", "all"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - forge_caddy_data:/data
      - forge_caddy_config:/config
    networks:
      - forge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  # 🌐 1. Platform Landing & Discovery Hub (Port 3000) - Hot-Reload
  landing:
    image: oven/bun:1.3-alpine
    container_name: forge-landing-dev
    profiles: ["core", "all"]
    working_dir: /app
    env_file:
      - ../../.env
    environment:
      - PORT=${LANDING_PORT:-3000}
      - LANDING_PORT=${LANDING_PORT:-3000}
      - NODE_ENV=development
    ports:
      - "${LANDING_PORT:-3000}:${LANDING_PORT:-3000}"
    volumes:
      - ../../package.json:/app/package.json:ro
      - ../../tsconfig.json:/app/tsconfig.json:ro
      - ../../.env:/app/.env:ro
      - ../../apps/src/sdk:/app/apps/src/sdk:ro
      - ../../apps/src/types:/app/apps/src/types:ro
      - ../../apps/src/ui:/app/apps/src/ui:ro
      - ../../apps/src/landing:/app/apps/src/landing:rw
      - forge_bun_cache:/root/.bun/install/cache
    command: ["bun", "--watch", "apps/src/landing/src/server.ts"]
    networks:
      - forge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  # 🏢 2. Main Portal & Org Canvas (Port 3001) - Hot-Reload
  portal:
    image: oven/bun:1.3-alpine
    container_name: forge-portal-dev
    profiles: ["core", "all"]
    working_dir: /app
    env_file:
      - ../../.env
    environment:
      - PORT=${PORTAL_PORT:-3001}
      - PORTAL_PORT=${PORTAL_PORT:-3001}
      - NODE_ENV=development
    ports:
      - "${PORTAL_PORT:-3001}:${PORTAL_PORT:-3001}"
    volumes:
      - ../../package.json:/app/package.json:ro
      - ../../tsconfig.json:/app/tsconfig.json:ro
      - ../../.env:/app/.env:ro
      - ../../apps/src/sdk:/app/apps/src/sdk:ro
      - ../../apps/src/types:/app/apps/src/types:ro
      - ../../apps/src/ui:/app/apps/src/ui:ro
      - ../../apps/src/auth:/app/apps/src/auth:ro
      - ../../apps/src/portal:/app/apps/src/portal:rw
      - ../../apps/data:/app/data:rw
      - forge_bun_cache:/root/.bun/install/cache
    command: ["bun", "--watch", "apps/src/portal/src/server.ts"]
    networks:
      - forge-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  # 📊 3. Developer Monitoring Dashboard (Port 3002) - Hot-Reload
  dev-dashboard:
    image: oven/bun:1.3-alpine
