# ==============================================================================
# SG Forge 2.0 - Optimized Development Docker Environment (Hot-Reload Enabled)
# ==============================================================================
name: sg-forge-dev

networks:
  forge-net:
    driver: bridge

volumes:
  forge_bun_cache:
    name: sg_forge_bun_cache
  forge_db_data:
    name: sg_forge_db_data
  forge_caddy_data:
    name: sg_forge_caddy_data
  forge_caddy_config:
    name: sg_forge_caddy_config

services:
  # 🔀 Unified Reverse Proxy Gateway (Port 80 / 443)
  proxy:
    image: caddy:2-alpine
    container_name: forge-proxy-dev
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - forge_caddy_data:/data
      - forge_caddy_config:/config
    env_file:
      - ../../.env
    networks:
      - forge-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

  # 🌐 1. Platform Landing & Discovery Hub (Port 3000) - Hot-Reload
  landing:
    image: oven/bun:1.3-alpine
    container_name: forge-landing-dev
    working_dir: /app
    environment:
      - PORT=${LANDING_PORT:-3000}
      - LANDING_PORT=${LANDING_PORT:-3000}
      - NODE_ENV=development
    ports:
      - "${LANDING_PORT:-3000}:${LANDING_PORT:-3000}"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
    command: ["bun", "--watch", "apps/src/landing/src/server.ts"]
    networks:
      - forge-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  # 🏢 2. Main Portal & Org Canvas (Port 3001) - Hot-Reload
  portal:
    image: oven/bun:1.3-alpine
    container_name: forge-portal-dev
    working_dir: /app
    environment:
      - PORT=${PORTAL_PORT:-3001}
      - PORTAL_PORT=${PORTAL_PORT:-3001}
      - NODE_ENV=development
    ports:
      - "${PORTAL_PORT:-3001}:${PORTAL_PORT:-3001}"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
      - forge_db_data:/app/data
    command: ["bun", "--watch", "apps/src/portal/src/server.ts"]
    networks:
      - forge-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  # 📊 3. Developer Monitoring Dashboard (Port 3002) - Hot-Reload
  dev-dashboard:
    image: oven/bun:1.3-alpine
    container_name: forge-dev-dashboard
    working_dir: /app
    environment:
      - PORT=${DEV_DASHBOARD_PORT:-3002}
      - DEV_DASHBOARD_PORT=${DEV_DASHBOARD_PORT:-3002}
      - NODE_ENV=development
    ports:
      - "${DEV_DASHBOARD_PORT:-3002}:${DEV_DASHBOARD_PORT:-3002}"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
    command: ["bun", "--watch", "apps/src/dev-dashboard/src/server.ts"]
    networks:
      - forge-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  # 📚 4. Developer Hub & SDK Playground (Port 3003) - Hot-Reload
  dev-hub:
    image: oven/bun:1.3-alpine
    container_name: forge-dev-hub
    working_dir: /app
    environment:
      - PORT=${DEV_HUB_PORT:-3003}
      - DEV_HUB_PORT=${DEV_HUB_PORT:-3003}
      - NODE_ENV=development
    ports:
      - "${DEV_HUB_PORT:-3003}:${DEV_HUB_PORT:-3003}"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
    command: ["bun", "--watch", "apps/src/dev-hub/src/server.ts"]
    networks:
      - forge-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  # 🧩 5. Forge App: Expenses (Port 8085) - Hot-Reload
  app-expenses:
    image: oven/bun:1.3-alpine
    container_name: forge-app-expenses
    working_dir: /app
    environment:
      - PORT=8085
      - NODE_ENV=development
    ports:
      - "8085:8085"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
      - forge_db_data:/app/data
    command: ["bun", "--watch", "forge-apps/expenses/src/server.ts"]
    networks:
      - forge-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  # 🧩 6. Forge App: Billing (Port 8086) - Hot-Reload
  app-billing:
    image: oven/bun:1.3-alpine
    container_name: forge-app-billing
    working_dir: /app
    environment:
      - PORT=8086
      - NODE_ENV=development
    ports:
      - "8086:8086"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
      - forge_db_data:/app/data
    command: ["bun", "--watch", "forge-apps/billing/src/server.ts"]
    networks:
      - forge-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  # 🧩 7. Forge App: Telemetry (Port 8087) - Hot-Reload
  app-telemetry:
    image: oven/bun:1.3-alpine
    container_name: forge-app-telemetry
    working_dir: /app
