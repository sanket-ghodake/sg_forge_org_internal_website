# ==============================================================================
# SG Forge 2.0 - Production Docker Environment
# ==============================================================================
name: sg-forge-prod

networks:
  forge-net:
    driver: bridge

volumes:
  forge_bun_cache:
    name: sg_forge_bun_cache_prod
  forge_db_data:
    name: sg_forge_db_data_prod
  forge_caddy_data:
    name: sg_forge_caddy_data_prod
  forge_caddy_config:
    name: sg_forge_caddy_config_prod

services:
  # 🔀 Reverse Proxy Gateway
  proxy:
    image: caddy:2-alpine
    container_name: forge-proxy-prod
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - forge_caddy_data:/data
      - forge_caddy_config:/config
    env_file:
      - ../../.env
    networks:
      - forge-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  # 🌐 1. Platform Landing & Discovery Hub (Port 3000)
  landing:
    image: oven/bun:1.3-alpine
    container_name: forge-landing-prod
    working_dir: /app
    environment:
      - PORT=${LANDING_PORT:-3000}
      - LANDING_PORT=${LANDING_PORT:-3000}
      - NODE_ENV=production
    ports:
      - "${LANDING_PORT:-3000}:${LANDING_PORT:-3000}"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
    command: ["bun", "run", "apps/src/landing/src/server.ts"]
    networks:
      - forge-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🏢 2. Main Portal & Org Canvas (Port 3001)
  portal:
    image: oven/bun:1.3-alpine
    container_name: forge-portal-prod
    working_dir: /app
    environment:
      - PORT=${PORTAL_PORT:-3001}
      - PORTAL_PORT=${PORTAL_PORT:-3001}
      - NODE_ENV=production
    ports:
      - "${PORTAL_PORT:-3001}:${PORTAL_PORT:-3001}"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
      - forge_db_data:/app/data
    command: ["bun", "run", "apps/src/portal/src/server.ts"]
    networks:
      - forge-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 📊 3. Developer Monitoring Dashboard (Port 3002)
  dev-dashboard:
    image: oven/bun:1.3-alpine
    container_name: forge-dev-dashboard-prod
    working_dir: /app
    environment:
      - PORT=${DEV_DASHBOARD_PORT:-3002}
      - DEV_DASHBOARD_PORT=${DEV_DASHBOARD_PORT:-3002}
      - NODE_ENV=production
    ports:
      - "${DEV_DASHBOARD_PORT:-3002}:${DEV_DASHBOARD_PORT:-3002}"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
    command: ["bun", "run", "apps/src/dev-dashboard/src/server.ts"]
    networks:
      - forge-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 📚 4. Developer Hub & SDK Playground (Port 3003)
  dev-hub:
    image: oven/bun:1.3-alpine
    container_name: forge-dev-hub-prod
    working_dir: /app
    environment:
      - PORT=${DEV_HUB_PORT:-3003}
      - DEV_HUB_PORT=${DEV_HUB_PORT:-3003}
      - NODE_ENV=production
    ports:
      - "${DEV_HUB_PORT:-3003}:${DEV_HUB_PORT:-3003}"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
    command: ["bun", "run", "apps/src/dev-hub/src/server.ts"]
    networks:
      - forge-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🔐 5. Central Identity & Auth Service (Port 3004)
  auth:
    image: oven/bun:1.3-alpine
    container_name: forge-auth-prod
    working_dir: /app
    environment:
      - PORT=${AUTH_PORT:-3004}
      - AUTH_PORT=${AUTH_PORT:-3004}
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - "${AUTH_PORT:-3004}:${AUTH_PORT:-3004}"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
      - forge_db_data:/app/data
    command: ["bun", "run", "apps/src/auth/src/server.ts"]
    networks:
      - forge-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🧩 6. Forge App: Expenses (Port 8085)
  app-expenses:
    image: oven/bun:1.3-alpine
    container_name: forge-app-expenses-prod
    working_dir: /app
    environment:
      - PORT=8085
      - NODE_ENV=production
    ports:
      - "8085:8085"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
      - forge_db_data:/app/data
    command: ["bun", "run", "forge-apps/expenses/src/server.ts"]
    networks:
      - forge-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🧩 7. Forge App: Billing (Port 8086)
  app-billing:
    image: oven/bun:1.3-alpine
    container_name: forge-app-billing-prod
    working_dir: /app
    environment:
      - PORT=8086
      - NODE_ENV=production
    ports:
      - "8086:8086"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
      - forge_db_data:/app/data
    command: ["bun", "run", "forge-apps/billing/src/server.ts"]
    networks:
      - forge-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🧩 8. Forge App: Telemetry (Port 8087)
  app-telemetry:
    image: oven/bun:1.3-alpine
    container_name: forge-app-telemetry-prod
    working_dir: /app
    environment:
      - PORT=8087
      - NODE_ENV=production
    ports:
      - "8087:8087"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
      - forge_db_data:/app/data
    command: ["bun", "run", "forge-apps/telemetry/src/server.ts"]
    networks:
      - forge-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
