# ==============================================================================
# SG Forge 2.0 - Production Docker Environment
# ==============================================================================
name: sg-forge-prod

networks:
  forge-net:
    driver: bridge

volumes:
  forge_bun_cache:
    name: sg_forge_bun_cache_prod
  forge_db_data:
    name: sg_forge_db_data_prod
  forge_caddy_data:
    name: sg_forge_caddy_data_prod
  forge_caddy_config:
    name: sg_forge_caddy_config_prod

services:
  proxy:
    image: caddy:2-alpine
    container_name: forge-proxy-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - forge_caddy_data:/data
      - forge_caddy_config:/config
    networks:
      - forge-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  landing:
    image: oven/bun:1.3-alpine
    container_name: forge-landing-prod
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ../../:/app
      - forge_bun_cache:/root/.bun/install/cache
    command: ["bun", "run", "apps/src/landing/src/server.ts"]
    networks:
      - forge-net
    restart: always
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'
