# ==============================================================================
# AG Dashboard 2.0 - Production Docker Environment
# 100% Dynamically Driven by .env parameters (COMPOSE_PROJECT_NAME, CONTAINER_PREFIX, DOCKER_NETWORK)
# ==============================================================================
name: ${COMPOSE_PROJECT_NAME:-ag_dashboard}-prod

networks:
  forge-net:
    name: ${DOCKER_NETWORK:-ag_net}
    driver: bridge

volumes:
  ag_caddy_data:
  ag_caddy_config:
  ag_prod_db_auth:
  ag_prod_db_portal:
  ag_prod_db_dev_dashboard:
  ag_prod_db_expenses:
  ag_prod_db_billing:
  ag_prod_db_telemetry:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # 🔀 Unified Reverse Proxy Gateway
  proxy:
    image: caddy:2-alpine
    container_name: ${CONTAINER_PREFIX:-ag}-proxy-prod
    profiles: ["core", "apps", "monitoring", "all"]
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../../proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ag_caddy_data:/data
      - ag_caddy_config:/config
    networks:
      - forge-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.50'

  # 🌐 1. Platform Landing & Discovery Hub (Port 3000)
  landing:
    build:
      context: ../../
      dockerfile: apps/src/landing/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-landing-prod
    profiles: ["core", "all"]
    env_file:
      - ../../.env
    environment:
      - PORT=${LANDING_PORT:-3000}
      - LANDING_PORT=${LANDING_PORT:-3000}
      - AUTH_SERVICE_URL=http://auth:${AUTH_PORT:-3004}
      - NODE_ENV=production
    networks:
      - forge-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🏢 2. Main Portal & Org Canvas (Port 3001)
  portal:
    build:
      context: ../../
      dockerfile: apps/src/portal/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-portal-prod
    profiles: ["core", "all"]
    env_file:
      - ../../.env
    environment:
      - PORT=${PORTAL_PORT:-3001}
      - PORTAL_PORT=${PORTAL_PORT:-3001}
      - AUTH_SERVICE_URL=http://auth:${AUTH_PORT:-3004}
      - NODE_ENV=production
    volumes:
      - ag_prod_db_portal:/app/data
    networks:
      - forge-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 📊 3. Developer Monitoring Dashboard (Port 3002)
  dev-dashboard:
    build:
      context: ../../
      dockerfile: apps/src/dev-dashboard/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-dev-dashboard-prod
    profiles: ["monitoring", "all"]
    env_file:
      - ../../.env
    environment:
      - PORT=${DEV_DASHBOARD_PORT:-3002}
      - DEV_DASHBOARD_PORT=${DEV_DASHBOARD_PORT:-3002}
      - AUTH_SERVICE_URL=http://auth:${AUTH_PORT:-3004}
      - NODE_ENV=production
    volumes:
      - ag_prod_db_dev_dashboard:/app/data
    networks:
      - forge-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 📚 4. Developer Hub & SDK Playground (Port 3003)
  dev-hub:
    build:
      context: ../../
      dockerfile: apps/src/dev-hub/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-dev-hub-prod
    profiles: ["monitoring", "all"]
    env_file:
      - ../../.env
    environment:
      - PORT=${DEV_HUB_PORT:-3003}
      - DEV_HUB_PORT=${DEV_HUB_PORT:-3003}
      - AUTH_SERVICE_URL=http://auth:${AUTH_PORT:-3004}
      - NODE_ENV=production
    networks:
      - forge-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🔐 5. Central Identity & Auth Service (Port 3004)
  auth:
    build:
      context: ../../
      dockerfile: apps/src/auth/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-auth-prod
    profiles: ["core", "all"]
    env_file:
      - ../../.env
    environment:
      - PORT=${AUTH_PORT:-3004}
      - AUTH_PORT=${AUTH_PORT:-3004}
      - NODE_ENV=production
    volumes:
      - ag_prod_db_auth:/app/data
    networks:
      - forge-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🧩 6. Forge App: Expenses (Port 8085)
  app-expenses:
    build:
      context: ../../
      dockerfile: forge-apps/expenses/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-app-expenses-prod
    profiles: ["apps", "all"]
    env_file:
      - ../../.env
    environment:
      - PORT=8085
      - AUTH_SERVICE_URL=http://auth:${AUTH_PORT:-3004}
      - NODE_ENV=production
    volumes:
      - ag_prod_db_expenses:/app/data
    networks:
      - forge-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🧩 7. Forge App: Billing (Port 8086)
  app-billing:
    build:
      context: ../../
      dockerfile: forge-apps/billing/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-app-billing-prod
    profiles: ["apps", "all"]
    env_file:
      - ../../.env
    environment:
      - PORT=8086
      - AUTH_SERVICE_URL=http://auth:${AUTH_PORT:-3004}
      - NODE_ENV=production
    volumes:
      - ag_prod_db_billing:/app/data
    networks:
      - forge-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8086/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🧩 8. Forge App: Telemetry (Port 8087)
  app-telemetry:
    build:
      context: ../../
      dockerfile: forge-apps/telemetry/docker/Dockerfile
    container_name: ${CONTAINER_PREFIX:-ag}-app-telemetry-prod
    profiles: ["apps", "all"]
    env_file:
      - ../../.env
    environment:
      - PORT=8087
      - AUTH_SERVICE_URL=http://auth:${AUTH_PORT:-3004}
      - NODE_ENV=production
    volumes:
      - ag_prod_db_telemetry:/app/data
    networks:
      - forge-net
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8087/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '1.0'

  # 🩺 Automated Container Health Monitor (Autoheal Watchdog)
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: ${CONTAINER_PREFIX:-ag}-autoheal-prod
    profiles: ["monitoring", "all"]
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=30
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - forge-net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'

